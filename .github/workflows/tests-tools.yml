name: Architecture guards

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, intl
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      # The tools tests: the architecture guards and the convert tool. The MySQL tests skip
      # without MYSQL_HOST/MYSQL_DATABASE; no database service and no secrets are needed.
      - run: vendor/bin/phpunit tools/tests
