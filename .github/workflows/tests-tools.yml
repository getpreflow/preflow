name: Architecture guards

on:
  push:
  pull_request:

jobs:
  guards:
    # 8.4 is the floor in composer.json, 8.5 the newest: both must pass.
    name: guards (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Every extension the lock file requires (composer check-platform-reqs --lock), plus intl.
          extensions: ctype, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, pcre, pdo, pdo_sqlite, phar, sodium, tokenizer, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Static analysis against the 8.4 floor (phpVersion in phpstan.neon): a call to anything newer
      # than 8.4 fails here, which the tests on 8.4 may never reach. Run it on the 8.4 leg only.
      - run: composer analyse
        if: matrix.php == '8.4'

      # The tools tests: the architecture guards and the convert tool. The MySQL tests skip
      # without MYSQL_HOST/MYSQL_DATABASE; no database service and no secrets are needed.
      - run: vendor/bin/phpunit tools/tests
