    <main class="folio-auth-main">
        <form class="folio-auth-card" method="post" action="/folio/login">
            <input type="hidden" name="_csrf_token" value="">
            <div class="folio-brand folio-auth-brand"><svg class="folio-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
    <path class="folio-logo-page" d="M9 3h10.5L26 9.5V26a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/>
    <path class="folio-logo-fold" d="M19.5 3v4.5a2 2 0 0 0 2 2H26Z"/>
    <path class="folio-logo-f" d="M11.5 12v10M11.5 12h7.5M11.5 16.8h5.2"/>
</svg>
<span class="folio-brand-name">Folio</span></div>
            <h1 class="folio-auth-title">Sign in</h1>
            <p class="folio-auth-lead">Welcome back. Your pages are waiting.</p>
                        <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
        <p class="folio-auth-foot">Folio, the content side of <a href="https://preflow.dev" rel="noopener">Preflow</a></p>
    </main>
